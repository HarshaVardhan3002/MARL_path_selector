[project]
name = "scion-marl-poc"
version = "0.0.1"
description = "SCION MARL path-selection PoC — calibrated synthetic data, multi-agent training, distillation."
requires-python = ">=3.11,<3.12"
readme = "README.md"
authors = [{ name = "Master's thesis project" }]

dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scion_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
